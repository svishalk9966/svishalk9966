<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Vishal's Tech Stack">
<title>Vishal Kumar Sharma — Tech Arsenal</title>
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanH{0%{transform:translateY(-3px);opacity:0}15%{opacity:.25}85%{opacity:.25}100%{transform:translateY(420px);opacity:0}}
@keyframes shineX{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(1100px) skewX(-15deg)}}
@keyframes badgePop{0%{opacity:0}100%{opacity:1}}
.badge{opacity:0;animation:badgePop .6s ease forwards}
.cat{opacity:0;animation:badgePop .5s ease forwards}
.scan{animation:scanH 5s linear infinite}
.shine{animation:shineX 5s ease-in-out 3s infinite}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#040d18"/><stop offset="100%" stop-color="#060b13"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#34d399;#38bdf8;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#34d399;#22d3ee;#34d399" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".05"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="1" y="1" width="898" height="418" rx="16"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".5" fill="rgba(34,211,238,.08)"/></pattern>
</defs>
<rect x="1" y="1" width="898" height="418" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="898" height="418" rx="16" fill="url(#dots)"/>
<rect x="1" y="1" width="898" height="418" rx="16" fill="none" stroke="url(#tg)" stroke-width="1.5"/>
<g clip-path="url(#clip)">
  <rect class="scan" x="0" y="-3" width="900" height="3" fill="rgba(34,211,238,.35)"/>
  <rect class="shine" x="0" y="0" width="60" height="420" fill="url(#shg)"/>
</g>
<text class="cat" x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="url(#tg)" filter="url(#glow)" style="animation-delay:.1s">&#x2699;&#xFE0F; Tech Arsenal</text>
<line x1="100" y1="52" x2="800" y2="52" stroke="url(#tg)" stroke-width=".8" opacity=".4"/>
