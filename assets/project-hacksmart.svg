<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img">
<defs>
<style>
@keyframes float2 { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
@keyframes glow2 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
.card { animation: float2 4s ease-in-out infinite; transform-origin: center; }
.border-glow { animation: glow2 3s ease-in-out infinite; animation-delay: 1s; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#120c18"/><stop offset="100%" stop-color="#07040a"/></linearGradient>
<linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
</defs>
<g class="card">
  <!-- Card Background -->
  <rect x="10" y="10" width="280" height="200" rx="12" fill="url(#bg2)" stroke="url(#accent2)" stroke-width="1.5" class="border-glow"/>
  
  <!-- Icon & Title -->
  <text x="30" y="45" font-size="20">🎓</text>
  <text x="60" y="42" font-size="16" font-weight="bold" fill="#e2e8f0">Hacksmart Academy</text>
  
  <!-- Subtitle -->
  <text x="30" y="65" font-size="12" fill="#a855f7" font-style="italic">EdTech Platform</text>
  
  <!-- Description -->
  <foreignObject x="30" y="80" width="240" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: sans-serif; font-size: 11.5px; line-height: 1.4;">
      Comprehensive education platform handling hundreds of students. Migrated from legacy MySQL to a lightning-fast Firebase backend.
    </div>
  </foreignObject>
  
  <!-- Stack tags -->
  <rect x="30" y="145" width="40" height="20" rx="10" fill="#180e22" stroke="#475569" stroke-width="1"/>
  <text x="50" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">PHP</text>
  
  <rect x="75" y="145" width="60" height="20" rx="10" fill="#180e22" stroke="#475569" stroke-width="1"/>
  <text x="105" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">Firebase</text>
  
  <rect x="140" y="145" width="70" height="20" rx="10" fill="#180e22" stroke="#475569" stroke-width="1"/>
  <text x="175" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">Cloudinary</text>
  
  <!-- Action Button -->
  <rect x="30" y="175" width="240" height="25" rx="6" fill="url(#accent2)"/>
  <text x="150" y="192" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">VIEW CODE ON GITHUB</text>
</g>
</svg>