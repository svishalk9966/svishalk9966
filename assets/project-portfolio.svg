<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img">
<defs>
<style>
@keyframes float3 { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-4px); } }
@keyframes glow3 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
.card { animation: float3 4.5s ease-in-out infinite; transform-origin: center; }
.border-glow { animation: glow3 3.5s ease-in-out infinite; animation-delay: 2s; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1510"/><stop offset="100%" stop-color="#040906"/></linearGradient>
<linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
</defs>
<g class="card">
  <!-- Card Background -->
  <rect x="10" y="10" width="280" height="200" rx="12" fill="url(#bg3)" stroke="url(#accent3)" stroke-width="1.5" class="border-glow"/>
  
  <!-- Icon & Title -->
  <text x="30" y="45" font-size="20">🌐</text>
  <text x="60" y="42" font-size="16" font-weight="bold" fill="#e2e8f0">Premium Portfolio</text>
  
  <!-- Subtitle -->
  <text x="30" y="65" font-size="12" fill="#34d399" font-style="italic">Personal Brand</text>
  
  <!-- Description -->
  <foreignObject x="30" y="80" width="240" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: sans-serif; font-size: 11.5px; line-height: 1.4;">
      A modern, highly responsive developer portfolio showcasing premium UI/UX design, smooth animations, and optimized performance.
    </div>
  </foreignObject>
  
  <!-- Stack tags -->
  <rect x="30" y="145" width="45" height="20" rx="10" fill="#0d1b14" stroke="#475569" stroke-width="1"/>
  <text x="52.5" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">React</text>
  
  <rect x="80" y="145" width="40" height="20" rx="10" fill="#0d1b14" stroke="#475569" stroke-width="1"/>
  <text x="100" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">Vite</text>
  
  <rect x="125" y="145" width="45" height="20" rx="10" fill="#0d1b14" stroke="#475569" stroke-width="1"/>
  <text x="147.5" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">CSS3</text>
  
  <!-- Action Button -->
  <rect x="30" y="175" width="240" height="25" rx="6" fill="url(#accent3)"/>
  <text x="150" y="192" font-size="11" font-weight="bold" fill="#022c22" text-anchor="middle" letter-spacing="1">VIEW LIVE SITE</text>
</g>
</svg>