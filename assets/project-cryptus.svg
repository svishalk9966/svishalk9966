<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img">
<defs>
<style>
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes glow { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
.card { animation: float 4s ease-in-out infinite; transform-origin: center; }
.border-glow { animation: glow 3s ease-in-out infinite; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1520"/><stop offset="100%" stop-color="#050914"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
</defs>
<g class="card">
  <!-- Card Background -->
  <rect x="10" y="10" width="280" height="200" rx="12" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5" class="border-glow"/>
  
  <!-- Icon & Title -->
  <text x="30" y="45" font-size="20">📲</text>
  <text x="60" y="42" font-size="16" font-weight="bold" fill="#e2e8f0">Cryptus Attendance</text>
  
  <!-- Subtitle -->
  <text x="30" y="65" font-size="12" fill="#22d3ee" font-style="italic">Enterprise Management</text>
  
  <!-- Description -->
  <foreignObject x="30" y="80" width="240" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: sans-serif; font-size: 11.5px; line-height: 1.4;">
      Biometric &amp; location-based attendance app with real-time tracking, PDF exports, and multi-role architecture.
    </div>
  </foreignObject>
  
  <!-- Stack tags -->
  <rect x="30" y="145" width="70" height="20" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="65" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">React Native</text>
  
  <rect x="105" y="145" width="55" height="20" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="132.5" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">Node.js</text>
  
  <rect x="165" y="145" width="60" height="20" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="195" y="159" font-size="10" fill="#cbd5e1" text-anchor="middle">MongoDB</text>
  
  <!-- Action Button -->
  <rect x="30" y="175" width="240" height="25" rx="6" fill="url(#accent)"/>
  <text x="150" y="192" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">VIEW CODE ON GITHUB</text>
</g>
</svg>